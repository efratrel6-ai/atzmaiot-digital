<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>הסכם יום צילום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Varela+Round&display=swap">
<style>
:root {
  --ink: #332B28; --muted: #6E625C; --line: #E8DCD3; --paper: #FFFFFF;
  --ground: #F6EFE8; --burgundy: #8E4556; --sage: #7F8C6E;
  --f-head: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --f-body: "Varela Round", "Rubik", "Arial Hebrew", Arial, sans-serif;
  color-scheme: light; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.7;
  padding: 1.5rem max(16px, env(safe-area-inset-right, 0px)) 3rem max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 42rem; margin-inline: auto; }
.doc { background: var(--paper); border: 1px solid var(--line); border-radius: 1.2rem; padding: clamp(1.25rem, 5vw, 2.5rem); display: flex; flex-direction: column; gap: 1.5rem; }
h1 { margin: 0; font-family: var(--f-head); font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.2; }
h1::after { content: ""; display: block; width: 3rem; height: 4px; border-radius: 4px; margin-top: .9rem; background: linear-gradient(90deg, var(--burgundy), var(--sage)); }
h2 { margin: 0 0 .5rem; font-family: var(--f-head); font-weight: 700; font-size: 1.15rem; color: var(--burgundy); }
p { margin: 0; }
.note { font-size: .9rem; color: var(--muted); }
.fields { display: grid; gap: .9rem; grid-template-columns: 1fr 1fr; }
.fields .full { grid-column: 1 / -1; }
label { display: flex; flex-direction: column; gap: .25rem; font-family: var(--f-head); font-weight: 500; font-size: .95rem; }
input[type="text"], input[type="tel"], input[type="email"], input[type="date"] {
  font: inherit; font-family: var(--f-body); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: .6rem; padding: .6rem .75rem; min-height: 2.75rem; width: 100%; }
input:focus-visible, button:focus-visible, .sign-box:focus-visible { outline: 3px solid var(--burgundy); outline-offset: 2px; }
.price { background: var(--ground); border-radius: .9rem; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: .4rem; }
.price .row { display: flex; justify-content: space-between; gap: 1rem; }
.price .total { font-family: var(--f-head); font-weight: 800; font-size: 1.3rem; border-top: 1px solid var(--line); padding-top: .5rem; margin-top: .25rem; }
.price .disc[hidden] { display: none; }
.check { flex-direction: row; align-items: center; gap: .6rem; font-weight: 500; }
.check input { width: 1.4rem; height: 1.4rem; accent-color: var(--burgundy); }
.sign-box { border: 2px dashed var(--line); border-radius: .9rem; background: #fff; height: 11rem; touch-action: none; position: relative; cursor: crosshair; }
.sign-box svg { width: 100%; height: 100%; display: block; }
.sign-box path { fill: none; stroke: #1b1b1b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sign-hint[hidden] { display: none; }
.sign-hint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; }
button { font: inherit; font-family: var(--f-head); font-weight: 700; border-radius: 2rem; padding: .75rem 1.5rem; min-height: 2.75rem; cursor: pointer; border: 1px solid var(--burgundy); }
.primary { background: var(--burgundy); color: #fff; }
.ghost { background: #fff; color: var(--burgundy); }
.error { color: #9b1c1c; font-weight: 700; min-height: 1.4em; }
@media (max-width: 30rem) { .fields { grid-template-columns: 1fr; } }
@media print {
  @page { size: A4; margin: 15mm; }
  body { background: #fff; padding: 0; }
  .doc { border: 0; padding: 0; }
  .actions, .error, .sign-hint, .screen-only { display: none !important; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="date"] { border: 0; border-bottom: 1px solid #999; border-radius: 0; padding-inline: 0; }
  .sign-box { border: 0; border-bottom: 1px solid #333; border-radius: 0; height: 7rem; }
  .price { border: 1px solid #ccc; background: #fff; }
}
</style>
</head>
<body>
<main class="wrap">
<form class="doc" id="f" autocomplete="off" novalidate>
<h1>הסכם יום צילום</h1>
<p class="note screen-only">הפרטים נשארים רק במכשיר שלך ולא נשלחים לאף מקום. בסוף לוחצים על "שמירה כ-PDF" ושולחים לאפרת.</p>

<section>
<h2>פרטי הלקוחה</h2>
<div class="fields">
<label class="full">שם מלא<input type="text" id="name" required></label>
<label>שם העסק<input type="text" id="biz"></label>
<label>תעודת זהות / ח.פ.<input type="text" id="idn" inputmode="numeric"></label>
<label>טלפון<input type="tel" id="tel"></label>
<label>אימייל<input type="email" id="mail"></label>
<label class="full">תאריך יום הצילום<input type="date" id="shoot"></label>
</div>
</section>

<section>
<h2>מחיר</h2>
<div class="price" aria-live="polite">
<div class="row"><span>יום צילום</span><bdi>6,500 ₪</bdi></div>
<div class="row disc" id="discRow" hidden><span>הנחת לקוחה חוזרת (10%)</span><bdi>-650 ₪</bdi></div>
<div class="row total"><span>סה״כ</span><bdi id="total">6,500 ₪</bdi></div>
</div>
<label class="check" style="margin-top:.75rem"><input type="checkbox" id="ret"> אני לקוחה חוזרת (הנחה של 10%)</label>
</section>

<section>
<h2>חתימה</h2>
<p class="note screen-only" style="margin-bottom:.5rem">חותמים עם האצבע או העכבר בתוך המסגרת.</p>
<div class="sign-box" id="box" tabindex="0" role="img" aria-label="אזור חתימה">
<svg id="sig" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
<div class="sign-hint" id="hint">חתמי כאן</div>
</div>
<p style="margin-top:.5rem">תאריך חתימה: <strong id="today"></strong></p>
</section>

<p class="error" id="err" role="alert"></p>
<div class="actions">
<button type="button" class="primary" id="save">שמירה כ-PDF</button>
<button type="button" class="ghost" id="clear">ניקוי החתימה</button>
</div>
</form>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ret = $("ret"), total = $("total"), disc = $("discRow");
  function price() {
    disc.hidden = !ret.checked;
    total.textContent = ret.checked ? "5,850 ₪" : "6,500 ₪";
  }
  ret.addEventListener("change", price);
  $("today").textContent = new Date().toLocaleDateString("he-IL");

  // Signature drawn as SVG paths so it stays sharp at any size in the PDF
  var box = $("box"), svg = $("sig"), path = null, pts = [], strokes = 0;
  function pos(e) {
    var r = svg.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10];
  }
  function fit() {
    var r = svg.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 " + r.width + " " + r.height);
  }
  box.addEventListener("pointerdown", function (e) {
    fit();
    box.setPointerCapture(e.pointerId);
    var p = pos(e);
    pts = [p];
    path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M" + p[0] + " " + p[1] + "l0 .1");
    svg.appendChild(path);
    $("hint").hidden = true;
    e.preventDefault();
  });
  box.addEventListener("pointermove", function (e) {
    if (!path) return;
    var p = pos(e); pts.push(p);
    path.setAttribute("d", "M" + pts.map(function (q) { return q[0] + " " + q[1]; }).join("L"));
  });
  function end() { if (path) { strokes++; path = null; } }
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
  $("clear").addEventListener("click", function () {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    strokes = 0; $("hint").hidden = false; $("err").textContent = "";
  });

  $("save").addEventListener("click", function () {
    var name = $("name").value.trim();
    if (!name) { $("err").textContent = "נא למלא שם מלא."; $("name").focus(); return; }
    if (!strokes) { $("err").textContent = "נא לחתום בתוך המסגרת."; box.focus(); return; }
    $("err").textContent = "";
    // The file name suggested when saving the PDF
    var old = document.title;
    document.title = "הסכם יום צילום - " + name;
    // Copy typed values into attributes so they print reliably
    ["name", "biz", "idn", "tel", "mail", "shoot"].forEach(function (id) { $(id).setAttribute("value", $(id).value); });
    window.print();
    document.title = old;
  });
})();
</script>
</body>
</html>
