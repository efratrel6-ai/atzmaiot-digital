<title>הצוות של {{OWNER}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: staggered two-column team wall on dotted paper; chats open as a full-screen sheet. */
:root{
  --bg:#f8f5f1; --dot:#ddd3c8; --card:#ffffff; --fg:#2b2326; --muted:#7a6f70;
  --sage:#86967a; --plum:#6e3448; --rose:#b98d7a; --bubble-me:#6e3448; --bubble-me-fg:#fff;
  --bubble-them:#ffffff; --line:#e7dfd6; --chip:#efe8df;
  --display:"Rubik","Heebo",system-ui,sans-serif; --body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1a1b; --dot:#352f30; --card:#28232a; --fg:#f2ece8; --muted:#b2a7a5;
  --sage:#9fb093; --plum:#c27c95; --rose:#d4a796; --bubble-me:#7d3d53; --bubble-me-fg:#fff;
  --bubble-them:#2c2629; --line:#3a3335; --chip:#332d2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1a1b; --dot:#352f30; --card:#28232a; --fg:#f2ece8; --muted:#b2a7a5;
  --sage:#9fb093; --plum:#c27c95; --rose:#d4a796; --bubble-me:#7d3d53; --bubble-me-fg:#fff;
  --bubble-them:#2c2629; --line:#3a3335; --chip:#332d2f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;direction:rtl;
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:28px 28px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top h1{font-family:var(--display);font-size:1.8rem;margin:0 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
.lead-card{all:unset;box-sizing:border-box;cursor:pointer;margin-top:22px;width:100%;display:flex;align-items:center;gap:18px;
  background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(60,40,40,.07)}
.lead-card:focus-visible,.m:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.lead-card .av{width:112px;flex:none}
.lead-card .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.lead-card .tag{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--plum);background:var(--chip);padding:3px 10px;border-radius:999px}
.lead-card b{font-family:var(--display);font-size:1.45rem}
.lead-card span.r{color:var(--muted)}
.sec{margin:28px 0 12px;font-size:.85rem;color:var(--muted);font-weight:500;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.m{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 10px 16px;transition:transform .2s,box-shadow .2s}
.m:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(60,40,40,.1)}
.m .av{width:92px;margin-bottom:6px}
.av{position:relative;aspect-ratio:1;max-width:100%}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--sage);box-shadow:0 6px 16px rgba(60,40,40,.12)}
.av.lead img{border-color:var(--plum);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--rose),0 8px 22px rgba(60,40,40,.14)}
.av .on{position:absolute;bottom:6%;right:6%;width:16px;height:16px;border-radius:50%;background:var(--sage);border:3px solid var(--bg)}
.m b{font-family:var(--display);font-size:1.15rem}
.m span{color:var(--muted);font-size:.86rem;line-height:1.35;text-wrap:balance}
.m .unread{display:inline-block;margin-inline-start:4px;width:8px;height:8px;border-radius:50%;background:var(--plum);vertical-align:middle}
.group-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  border:0;cursor:pointer;color:#fff;font:700 1.1rem var(--body);padding:16px 30px;border-radius:999px;
  background:linear-gradient(90deg,#6e3448,#b98d7a);box-shadow:0 10px 28px rgba(110,52,72,.35);display:flex;gap:10px;align-items:center;white-space:nowrap}
.group-btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.stack{display:flex}
.stack img{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-inline-start:-8px;object-fit:cover}
.stack img:first-child{margin-inline-start:0}

/* chat sheet */
.chat{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.chat[hidden],.confirm[hidden],.pending[hidden],.addf[hidden],.note[hidden],.mic[hidden],.voicehint[hidden],.say[hidden]{display:none!important}
.ch-head{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:var(--fg);flex:none}
.icon-btn:hover,.icon-btn:focus-visible{background:var(--chip)}
.ch-head img.h{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--sage);flex:none}
.ch-title{flex:1;min-width:0}
.ch-title b{display:block;font-family:var(--display);font-size:1.1rem}
.ch-title small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  padding-block:16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.intro{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.intro p{margin:0;line-height:1.55}
.intro h3{margin:0;font-size:.85rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;background:var(--chip);color:var(--fg);padding:8px 12px;border-radius:999px;font-size:.9rem}
.chip:hover,.chip:focus-visible{background:var(--sage);color:#fff}
.row{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.row.me{align-self:flex-start;flex-direction:row}
.row.them{align-self:flex-end;flex-direction:row-reverse}
.row img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.bubble{padding:10px 14px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.me .bubble{background:var(--bubble-me);color:var(--bubble-me-fg);border-end-start-radius:6px}
.them .bubble{background:var(--bubble-them);border:1px solid var(--line);border-end-end-radius:6px}
.bubble .who{display:block;font-size:.8rem;font-weight:700;color:var(--plum);margin-bottom:2px}
.typing{color:var(--muted);font-size:.9rem;align-self:flex-end}
.note{color:var(--muted);font-size:.85rem;text-align:center;align-self:center;max-width:90%}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:20px;padding:10px 14px;font:16px var(--body);max-height:140px}
.composer textarea:focus{outline:2px solid var(--sage)}
.send{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:1.2rem;flex:none}
.send[disabled]{opacity:.45;cursor:default}
.send:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.confirm{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;background:var(--chip);font-size:.9rem}
.confirm button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.confirm button.danger{background:var(--plum);color:#fff;border-color:var(--plum)}
.evs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ev{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;white-space:normal}
.ev .when{font-size:.85rem;color:var(--muted);display:block}
.ev .t{font-weight:700}
.ev button{all:unset;cursor:pointer;background:var(--sage);color:#fff;padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:700}
.ev button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.ev button[disabled]{opacity:.6;cursor:default}
.ev .ok{color:var(--sage);font-weight:700;font-size:.9rem}
.calnote{font-size:.85rem;color:var(--muted)}
.attach{all:unset;cursor:pointer;width:40px;height:44px;display:grid;place-items:center;font-size:1.3rem;color:var(--muted);flex:none;border-radius:50%}
.attach:hover,.attach:focus-visible{background:var(--chip);color:var(--fg)}
.pending{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border-top:1px solid var(--line);
  padding-top:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.pend{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:12px;padding:4px 6px 4px 10px;font-size:.85rem;max-width:100%;min-width:0}
.pend img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.pend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.pend button{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.pend button:hover,.pend button:focus-visible{background:var(--line)}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.att img{width:120px;max-width:100%;border-radius:12px;display:block}
.att .file{font-size:.85rem;opacity:.9}
.mic{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;background:var(--chip);flex:none}
.mic:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.mic.on{background:#c0392b;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{box-shadow:0 0 0 8px rgba(192,57,43,0)}}
.say{all:unset;cursor:pointer;font-size:.8rem;color:var(--muted);margin-top:6px;display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:999px;background:var(--chip)}
.say:focus-visible{outline:2px solid var(--plum)}
.say.on{background:var(--sage);color:#fff}
.vtag{font-size:.78rem;opacity:.85;display:block;margin-bottom:2px}
.voicehint{font-size:.8rem;color:var(--muted);text-align:center;padding:4px 12px 0;background:var(--card)}
.board-btn{all:unset;cursor:pointer;margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
  padding:10px 16px;border-radius:999px;font-weight:700;color:var(--plum)}
.board-btn:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.board-btn .cnt{background:#c0392b;color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:25;overflow-y:auto}
.sheet[hidden]{display:none!important}
.sheet .inner{max-width:880px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bhead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;z-index:2}
.bhead h2{margin:0;font-family:var(--display);font-size:1.4rem;flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile:focus-visible{outline:3px solid var(--plum)}
.tile.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.tile b{font-size:1.6rem;font-family:var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--muted)}
.tile i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px}
.st-todo{--st:#8a8f98}.st-doing{--st:#3b7dd8}.st-stuck{--st:#c0392b}.st-rework{--st:#d68910}.st-done{--st:#5e8c4a}
.tile i,.pill i{background:var(--st)}
.btools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.bt{all:unset;cursor:pointer;background:var(--plum);color:#fff;padding:9px 14px;border-radius:999px;font-weight:700;font-size:.92rem}
.bt.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.bt:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.bt[disabled]{opacity:.5;cursor:default}
.addf{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;grid-template-columns:1fr}
@media (min-width:640px){.addf{grid-template-columns:2fr 1fr 1fr 1fr auto}}
.addf input,.addf select,.task select,.task textarea{font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;white-space:pre-wrap;line-height:1.6}
.review .rh{display:flex;gap:10px;align-items:center;margin-bottom:6px;white-space:normal}
.review .rh img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.lane{margin-top:18px}
.lane h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:1.05rem}
.lane h3 img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--sage)}
.lane h3 small{color:var(--muted);font-weight:400}
.lane h3 .sh{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip)}
.tasks{display:grid;gap:8px}
.task{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--st);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.task .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.task .tt{font-weight:700;min-width:0;overflow-wrap:anywhere;flex:1}
.task .meta{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.task .late{color:#c0392b;font-weight:700}
.task .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .note2{font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lnk{all:unset;cursor:pointer;font-size:.85rem;color:var(--muted);text-decoration:underline}
.lnk:focus-visible{outline:2px solid var(--plum)}
.empty{color:var(--muted);font-size:.9rem;padding:6px 2px}
.tks{display:flex;flex-direction:column;gap:6px;margin-top:10px;white-space:normal}
.tk{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:.9rem}
.tk button{all:unset;cursor:pointer;background:var(--plum);color:#fff;padding:5px 10px;border-radius:999px;font-size:.82rem;font-weight:700}
.tk .ok{color:var(--sage);font-weight:700;font-size:.85rem}
.ro #addToggle,.ro #addForm,.ro .task select,.ro .task .lnk,.ro .tk button{display:none!important}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cat{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 12px;border-radius:999px;font-size:.85rem;background:var(--card);border:1px solid var(--line)}
.cat i{width:10px;height:10px;border-radius:50%;background:var(--oc)}
.cat.sel{background:var(--oc);color:#fff;border-color:var(--oc)}
.cat.sel i{background:#fff}
.cat:focus-visible{outline:2px solid var(--fg)}
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-inline-start:auto}
.viewtog button{all:unset;cursor:pointer;padding:8px 12px;font-size:.88rem;background:var(--card)}
.viewtog button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.viewtog button:focus-visible{outline:2px solid var(--plum);outline-offset:-2px}
.task{border-inline-start-color:var(--oc)!important}
.ochip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:999px;background:color-mix(in srgb,var(--oc) 18%,transparent);font-size:.85rem;font-weight:700;white-space:nowrap}
.ochip img,.ochip .sh{width:22px;height:22px;border-radius:50%;object-fit:cover;font-size:.75rem}
.stdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--st);margin-inline-end:4px}
.task .due,.tbl .due{font:14px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.remind{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:8px}
.remind input{font:14px var(--body);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.rmtag{font-size:.82rem;font-weight:700;color:var(--plum)}
.rmtag.due{color:#c0392b}
.tblwrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;min-width:720px;font-size:.9rem}
.tbl th{text-align:start;font-weight:700;color:var(--muted);font-size:.8rem;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr td:first-child{border-inline-start:5px solid var(--oc);font-weight:700;min-width:180px}
.tbl select{font:14px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tbl tr:last-child td{border-bottom:0}
.toprow{display:flex;gap:8px;flex-wrap:wrap}
.brief-btn{all:unset;cursor:pointer;margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:linear-gradient(90deg,#6e3448,#b98d7a);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700}
.brief-btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.bsum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;line-height:1.6;margin-top:8px}
.bfocus{background:color-mix(in srgb,var(--plum) 12%,var(--card));border:1px solid var(--plum);border-radius:16px;padding:14px;margin-top:12px;line-height:1.55}
.barea{margin-top:18px}
.barea h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:1.1rem}
.barea h3 img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--oc)}
.bitem{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--oc);border-radius:14px;padding:12px;display:grid;gap:6px;margin-bottom:8px;line-height:1.5}
.bitem b{font-size:1rem}
.bitem .why,.bitem .step{font-size:.92rem}
.bitem .step{color:var(--muted)}
.bitem .act{display:flex;justify-content:flex-start}
.bitem .act button{all:unset;cursor:pointer;background:var(--plum);color:#fff;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:700}
.bitem .act .ok{color:var(--sage);font-weight:700;font-size:.88rem}
.bmeta{color:var(--muted);font-size:.85rem;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>הצוות שלי</h1>
    <p>לחצי על מישהו מהצוות כדי לדבר איתו בפרטי, או על הכפתור למטה כדי לכתוב לכולם.</p>
    <div class="toprow">
      <button class="brief-btn" id="briefBtn" type="button">💡 מה כדאי לי לקדם עכשיו?</button>
      <button class="board-btn" id="boardBtn" type="button">📋 לוח המשימות <span class="cnt" id="boardCnt" hidden></span></button>
    </div>
  </header>
  <div id="leadSlot"></div>
  <h2 class="sec">הצוות</h2>

</div>

<section class="sheet" id="brief" hidden aria-label="מה לקדם עכשיו">

      <button class="icon-btn" id="boardBack" type="button" aria-label="חזרה לצוות">→</button>
      <h2>לוח המשימות</h2>

      <input id="newTitle" placeholder="מה צריך לעשות?" aria-label="שם המשימה" maxlength="160" required>

      <select id="newStatus" aria-label="סטטוס"></select>
      <input id="newDue" type="date" aria-label="תאריך יעד">
      <button class="bt" type="submit">הוספה</button>
    </form>
    <div id="boardMsg" class="note" hidden></div>
    <div id="review"></div>

<section class="chat" id="chat" hidden aria-live="polite">
  <div class="ch-head">
    <button class="icon-btn" id="back" type="button" aria-label="חזרה לצוות">→</button>
    <span id="headPic"></span>
    <div class="ch-title"><b id="headName"></b><small id="headRole"></small></div>

    <span>למחוק את כל השיחה הזאת?</span>
    <button type="button" class="danger" id="confirmYes">כן, למחוק</button>
    <button type="button" id="confirmNo">ביטול</button>

    <button class="attach" id="attachBtn" type="button" aria-label="צירוף קובץ או תמונה" title="צירוף קובץ או תמונה">📎</button>
    <input type="file" id="fileIn" multiple accept="image/jpeg,image/png,image/webp,image/gif,.txt,.csv,.md,.json,text/plain,text/csv,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    <textarea id="input" rows="1" placeholder="כתבי הודעה…" aria-label="הודעה"></textarea>
    <button class="mic" id="micBtn" type="button" aria-label="הודעה קולית" title="הודעה קולית: לחצי, דברי, ולחצי שוב לשליחה" hidden>🎤</button>
    <button class="send" id="send" type="submit" aria-label="שליחה">➤</button>
  </form>
</section>

<script>
const PHOTOS = __PHOTOS__;
const CONFIG = __CONFIG__;
const OWNER = CONFIG.owner, BIZ = CONFIG.biz;
const TEAM = CONFIG.team;
/* roles used by fixed features (lead = manager, marketing, sales, strategy, product) */
const R = Object.assign({lead:(TEAM.find(m=>m.lead)||TEAM[0]).id}, CONFIG.roles||{});
for(const k of ["marketing","sales","strategy","product"]) if(!TEAM.some(m=>m.id===R[k])) R[k]=R.lead;
/* letter avatar for members without a photo */
for(const m of TEAM) if(!PHOTOS[m.id]) PHOTOS[m.id]="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${m.color||"#7a2e4a"}"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Heebo,Arial,sans-serif" font-size="46" font-weight="700" fill="#fff">${m.name.slice(0,1)}</text></svg>`);
const byId = Object.fromEntries(TEAM.map(m=>[m.id,m]));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*/gm,"")
  .replace(/https?:\/\/[^\s<>"')\]]+/g,u=>`<a href="${u}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${u.length>48?u.slice(0,45)+"…":u}</a>`);
const img = (id,cls="")=>`<img src="${PHOTOS[id]}" alt="${esc(byId[id].name)}" class="${cls}">`;

/* ---------- storage: private per-viewer db, with browser fallback ---------- */
let db=null, uid=null; const KB={};
const EXCEL=`רמת עבודה: את/ה ברמה של היועצים הטובים בישראל בתחום שלך, ואת/ה כאן כדי שהעסק של {{OWNER}} יצליח בגדול. אל תסתפק/י בלענות על השאלה: תחשוב/י צעד קדימה.
- כשמתאים, תן/תני: המלצה ברורה אחת ולמה, צעד ראשון שאפשר לעשות היום או השבוע, ומה למדוד כדי לדעת שזה עובד.
- אם את/ה רואה הזדמנות, סיכון או משהו שכדאי לקדם שהיא לא שאלה עליו, ציין/צייני אותו בקצרה.
- אל תהיה/י "כן-אדם": אם רעיון פחות טוב, אמור/אמרי את זה בעדינות ובכנות, והצע/הציעי חלופה טובה יותר.
- תמקד/י: עדיף דבר אחד חזק על פני עשרה טיפים. תחשוב/י על הכנסות, על הלקוחה ועל הזמן המוגבל של {{OWNER}}.
- השתמש/י בתיק העסק, בלוח המשימות ובהיסטוריה של השיחה. אל תמציא/י נתונים; אם חסר נתון חשוב, שאל/י עליו.`;
/* private troubleshooting log: what happened on this device, readable only by the viewer (and Claude via the owner) */
const DBG=[]; let dbgTimer=null;
function dlog(ev,extra){ try{ DBG.push({t:Date.now(),ev,...(extra||{})}); if(DBG.length>120) DBG.splice(0,DBG.length-120);
  if(db&&uid&&!dbgTimer) dbgTimer=setTimeout(()=>{ dbgTimer=null; db.doc(`data/users/${uid}/debug`).set({log:DBG.slice(-120),ua:navigator.userAgent.slice(0,160),v:"tpl1"}).catch(()=>{}) },1500) }catch(e){} }
window.addEventListener("error",e=>dlog("page_error",{m:String(e.message).slice(0,200)}));
window.addEventListener("unhandledrejection",e=>dlog("unhandled",{m:String(e.reason&&(e.reason.code||e.reason.message)||e.reason).slice(0,200)}));
let MB=[]; // Noa's marketing brief, split into sections
async function loadMB(){ try{ const out=[]; for(const k of ["mb1","mb2","mb3"]){ const s=await db.doc(`data/users/${uid}/${k}`).get(); if(s.exists&&Array.isArray(s.data().sections)) out.push(...s.data().sections) } MB=out }catch(e){} }
function mbWords(t){ return String(t).toLowerCase().replace(/[^\u0590-\u05FFa-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>=3).flatMap(w=>/^[והבלמשכ]/.test(w)&&w.length>=4?[w,w.slice(1)]:[w]) }
function mbPick(query,budget=14000,always=(CONFIG.alwaysSections||[])){
  if(!MB.length) return "";
  const q=new Set(mbWords(query)); const nums=(String(query).match(/\b([1-9]|[1-3][0-9]|40)\b/g)||[]).map(n=>n.padStart(2,"0"));
  const scored=MB.map((x,i)=>{ let sc=0; const tw=mbWords(x.t), bw=mbWords(x.b);
    for(const w of tw) if(q.has(w)) sc+=4; for(const w of bw) if(q.has(w)) sc+=0.15;
    if(nums.some(n=>x.t.startsWith(n+" "))) sc+=50; if(always.includes(x.t)) sc+=1000; return {x,sc,i} })
    .filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc);
  const pick=[]; let used=0;
  for(const o of scored){ const block=`### ${o.x.t}${o.x.p?" ("+o.x.p+")":""}\n${o.x.b}`; if(used+block.length>budget) continue; pick.push(block); used+=block.length; if(pick.length>=7) break }
  const toc=MB.map(x=>x.t).join(" · ");
  return `\n=== מסמך העבודה לשיווק. תוכן העניינים: ${toc}\nהקטעים הרלוונטיים לשיחה: ===\n${pick.join("\n\n")}\n=== סוף הקטעים. ציטוט ישיר = דבריה של {{OWNER}}; הצעה/תסריט = טיוטה שעוד לא אושרה לפרסום. מחירים במסמך הם לשימוש פנימי: לא לפרסם מחיר בלי אישור שלה. ===\n`;
}
async function loadKB(){ try{ const s=await db.doc(`data/users/${uid}/kb`).get(); const x=s.exists?s.data():{}; for(const k in x){ if((byId[k]||k==="all")&&x[k]&&x[k].text) KB[k]=String(x[k].text) } }catch(e){} }
const store = {
  async get(chat){
    if(db&&uid){ try{ const s=await db.doc(`data/users/${uid}/chat-${chat}`).get(); if(s.exists) return JSON.parse(JSON.stringify(s.data().messages||[])) }catch(e){} }
    try{ return JSON.parse(localStorage.getItem("team-"+chat)||"[]") }catch(e){ return [] }
  },
  async put(chat,messages){
    const m = messages.slice(-80);
    if(db&&uid){ try{ await Promise.race([db.doc(`data/users/${uid}/chat-${chat}`).set({messages:m,updated:Date.now()}),new Promise((_,bad)=>setTimeout(()=>bad(new Error("slow")),10000))]); try{ localStorage.removeItem("team-"+chat) }catch(e){} return }catch(e){} }
    try{ localStorage.setItem("team-"+chat,JSON.stringify(m)) }catch(e){}
  }
};
const cache = {};
async function load(chat){ if(!cache[chat]) cache[chat]=await store.get(chat); return cache[chat] }

/* ---------- team wall ---------- */
function renderGrid(){
  const L=TEAM.find(m=>m.lead);
  $("#leadSlot").innerHTML=`<button class="lead-card" type="button" data-id="${L.id}" aria-label="שיחה עם ${esc(L.name)}, ${esc(L.role)}">
      <span class="av lead">${img(L.id)}<i class="on"></i></span>
      <span class="txt"><span class="tag">${L.f?"מנהלת הצוות":"מנהל הצוות"}</span><b>${esc(L.name)}</b><span class="r">${esc(L.role)}</span></span></button>`;
  $("#grid").innerHTML = TEAM.filter(m=>!m.lead).map(m=>`
    <button class="m" type="button" data-id="${m.id}" aria-label="שיחה עם ${esc(m.name)}, ${esc(m.role)}">
      <span class="av ${m.lead?"lead":""}">${img(m.id)}<i class="on"></i></span>
      <b>${esc(m.name)}</b><span>${esc(m.role)}</span>
    </button>`).join("");
  $("#stack").innerHTML = (CONFIG.stack||TEAM.slice(0,4).map(m=>m.id)).map(id=>img(id)).join("");
}
document.querySelector(".wrap").addEventListener("click",e=>{ const b=e.target.closest(".m,.lead-card"); if(b) openChat(b.dataset.id) });
$("#groupBtn").addEventListener("click",()=>openChat("group"));

/* ---------- chat ---------- */
let current=null, busy=false, ctl=null;
async function openChat(id){
  current=id; $("#chat").hidden=false; $("#confirm").hidden=true;
  if(id==="group"){
    $("#headPic").innerHTML=`<span class="stack">${(CONFIG.stack||TEAM.slice(0,3).map(m=>m.id)).slice(0,3).map(x=>img(x)).join("")}</span>`;
    $("#headName").textContent="הקבוצה של הצוות";
    $("#headRole").textContent=TEAM.map(m=>m.name).join(", ");
    $("#input").placeholder="כתבי לכל הצוות…";
  }else{
    const m=byId[id];
    $("#headPic").innerHTML=img(id,"h");
    $("#headName").textContent=m.name; $("#headRole").textContent=m.role;
    $("#input").placeholder=`כתבי ל${m.name}…`;
  }
  document.body.style.overflow="hidden";
  await render();
  $("#input").focus({preventScroll:true});
}
function closeChat(){ ctl?.abort(); try{ tts?.stop(); if(dict?.active()) dict.stop().catch(()=>{}) }catch(e){} hint(""); $("#chat").hidden=true; current=null; document.body.style.overflow="" }
$("#back").addEventListener("click",closeChat);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("#chat").hidden) closeChat() });

function introHTML(id){
  if(id==="group") return `<div class="intro"><p>כאן כל הצוות ביחד. כתבי מה את צריכה, ו${esc(byId[R.lead].name)} ${byId[R.lead].f?"תחלק":"יחלק"} את העבודה. מי שזה בתחום שלו יענה לך.</p>
    <h3>אפשר להתחיל מכאן</h3><div class="chips">${["בואו נתכנן את השבוע","אני רוצה להשיק מחזור חדש של הקורס","יש לי מעט זמן השבוע, מה הכי חשוב?","רעיונות להגדיל הרשמות לקורס"].map(s=>`<button class="chip" type="button" data-say="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  const m=byId[id];
  return `<div class="intro"><p>${esc(m.about)}</p><h3>במה ${m.f?"אני יכולה":"אני יכול"} לעזור</h3>
    <div class="chips">${m.skills.map(s=>`<button class="chip" type="button" data-say="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    ${m.cal?`<p class="calnote">📅 ${m.f?"אני רואה":"אני רואה"} את היומן שלך. אני לא מכניסה שום דבר ליומן ולא משנה כלום, רק מציעה. משהו נכנס ליומן רק כשאת לוחצת "להכניס ליומן".</p>`:""}</div>`;
}
async function render(extra=""){
  const id=current, msgs=await load(id); if(id!==current) return;
  const html=[introHTML(id)];
  if(!dict&&!msgs.length) html.push(`<div class="note">🎤 רוצה לדבר במקום לכתוב? לחצי על המיקרופון שבמקלדת של הטלפון ודברי בעברית.</div>`);
  for(const x of msgs){
    if(x.r==="me") html.push(`<div class="row me"><div class="bubble">${x.v?'<span class="vtag">🎤 הודעה קולית</span>':""}${attHTML(x.a)}${fmt(x.t)}</div></div>`);
    else{ const w=x.who||id, i=msgs.indexOf(x); html.push(`<div class="row them">${img(w)}<div class="bubble">${id==="group"?`<span class="who">${esc(byId[w]?.name||"")}</span>`:""}${fmt(x.t)}${evHTML(x,i)}${tkHTML(x,i)}${tts?`<br><button class="say" type="button" data-say-i="${i}" aria-label="להשמיע בקול">🔊 להשמיע</button>`:""}</div></div>`) }
  }
  if(!extra&&!busy&&msgs.length&&msgs[msgs.length-1].r==="me") html.push(`<div class="note">עוד לא התקבלה תשובה להודעה הזאת. <button class="lnk" type="button" id="retryBtn">🔄 לקבל תשובה</button></div>`);
  $("#msgs").innerHTML=html.join("")+extra;
  $("#msgs").scrollTop=$("#msgs").scrollHeight;
}
$("#msgs").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  const s=c.dataset.say; $("#input").value = current==="group"? s : `בואי נעבוד על: ${s}`.replace("בואי", byId[current].f?"בואי":"בוא"); $("#input").focus(); grow() });

const input=$("#input");
function grow(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,140)+"px" }
input.addEventListener("input",grow);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("#form").requestSubmit() } });
$("#msgs").addEventListener("click",e=>{ if(e.target.closest("#retryBtn")) send(true) });
$("#form").addEventListener("submit",e=>{ e.preventDefault(); if(busy&&ctl&&e.submitter&&e.submitter.id==="send"){ ctl.abort(); return } send() });

$("#clearBtn").addEventListener("click",()=>{ $("#confirm").hidden=false });
$("#confirmNo").addEventListener("click",()=>{ $("#confirm").hidden=true });
$("#confirmYes").addEventListener("click",async()=>{ $("#confirm").hidden=true; cache[current]=[]; await store.put(current,[]); render() });

let sample=null, TIER=null;
function tierOpt(){ return TIER?{modelTier:TIER}:{} }
const ERR={not_granted:"צריך לאשר לצוות לענות (חלון האישור שקופץ). אפשר לנסות שוב בפתיחה הבאה של הדף.",
  rate_limited:"הצוות קצת עמוס כרגע. נסי שוב בעוד כמה דקות.",
  refused:"על זה לא נוכל לענות. נסי לנסח אחרת.",
  images_unavailable:"כרגע לא הצלחתי לשלוח את התמונה. נסי שוב, או כתבי במילים מה יש בה.",
  image_rejected:"את התמונה הזאת לא הצלחתי לפתוח. נסי צילום מסך אחר.",
  prompt_too_large:"הקובץ ארוך מדי. נסי לצרף רק את החלק החשוב."};
const errText=c=>ERR[c]||`משהו לא עבד הפעם. נסי לשלוח שוב.${c?" (קוד: "+c+")":""}`;

function personaPrompt(m){
  return `את/ה ${m.name}, ${m.role} בצוות האישי של {{OWNER}}. ${BIZ}
איך את/ה עובד/ת: ${m.how}
כללים: כתוב/כתבי בעברית פשוטה, חמה וקצרה, בלשון ${m.f?"נקבה":"זכר"} על עצמך ופנייה ל{{OWNER}} בלשון נקבה. בלי מונחים טכניים. תשובה קצרה (עד כ-8 שורות) אלא אם ביקשה טקסט ארוך. כשזה עוזר, תני רשימה קצרה של צעדים. אל תמציא/י עובדות על העסק שלה (מחירים, תאריכים, מספרים); אם חסר מידע, שאל/י שאלה אחת. אל תזכיר/י שאת/ה בינה מלאכותית אלא אם היא שואלת.
${EXCEL}
${KB.all?"\n=== תיק העסק של {{OWNER}} ===\n"+KB.all+"\n=== סוף תיק העסק ===\n":""}
${KB[m.id]?"\n=== הידע המקצועי שלך על העסק של {{OWNER}} ===\n"+KB[m.id]+"\n=== סוף הידע ===\n":""}
${tasksContext(m.id)}
כשאת/ה ו{{OWNER}} מסכמים משימה ברורה לביצוע, הוסף/הוסיפי בסוף התשובה בלוק בדיוק בצורה הזאת (שורה לכל משימה, עד 5; אחראי/ת = id של חבר צוות מהרשימה ${TEAM.map(x=>x.id).join(", ")}, או shared למשימה משותפת, או me למשימה שלה):
[משימות]
${R.marketing} | לכתוב 3 כיתובים לרילס של השבוע
[/משימות]
היא תחליט אם להוסיף אותן ללוח המשימות.`;
}
function turns(m,msgs){
  const out=[];
  for(const x of msgs){ const role=x.r==="me"?"user":"assistant"; const last=out[out.length-1];
    if(last&&last.role===role) last.content+="\n\n"+x.t; else out.push({role,content:x.t}) }
  while(out.length&&out[0].role!=="user") out.shift();

      const stall=new Promise(res=>{ const iv=setInterval(()=>{ if(!busy||myCtl.signal.aborted){ clearInterval(iv); return }
        if(streamed&&Date.now()-lastTick>12000){ clearInterval(iv); res({text:streamed,stalled:true}) } },1000) });
      const t0=Date.now(); let firstText=0; dlog("call_start",{chat:id,turns:conv.length,chars:conv.reduce((n,c)=>n+c.content.length,0)});
      const call=sample(conv,{...popts,onText:({text})=>{ if(!firstText){ firstText=Date.now(); dlog("first_text",{ms:firstText-t0}) } streamed=text; lastTick=Date.now();
        if(current!==id) return;
        if(!live){ $("#typing")?.remove(); const row=document.createElement("div"); row.className="row them"; row.innerHTML=img(id)+'<div class="bubble"></div>'; $("#msgs").appendChild(row); live=row.lastChild }
        live.innerHTML=fmt(text.split("[יומן]")[0].split("[משימות]")[0]); $("#msgs").scrollTop=$("#msgs").scrollHeight }});
      call.then(r=>dlog("call_resolved",{ms:Date.now()-t0,len:(r&&r.text||"").length}),e=>dlog("call_rejected",{ms:Date.now()-t0,code:e&&e.code}));
      const out=await Promise.race([call,stall]); const ans=out.text;
      if(out.stalled){ dlog("stalled_finish",{len:ans.length}); call.catch(()=>{}); try{ myCtl.abort() }catch(e){} }
      const st=splitTasks(ans); const sp=splitEvents(st.t);
      const reply={r:"them",who:id,t:sp.t,at:Date.now()}; if(sp.ev.length) reply.ev=sp.ev; if(st.tk.length) reply.tk=st.tk;
      msgs.push(reply);
      await store.put(id,msgs); if(current===id) await render();
      if(spoke&&current===id) speakReplies(id,[msgs[msgs.length-1]]);
    }
  }catch(e){
    dlog("send_error",{code:e&&e.code,m:String(e&&e.message||"").slice(0,150),timedOut});
    if(e&&e.code==="cancelled"){ if(current===id) await render(`<div class="note">${timedOut?"התשובה לקחה יותר מדי זמן ועצרתי אותה. נסי לשלוח שוב, אפשר גם לקצר את השאלה.":"עצרת את התשובה. אפשר לשלוח שוב."}</div>`); return }
    if(e&&e.text&&id!=="group"){ msgs.push({r:"them",who:id,t:e.text,at:Date.now()}); await store.put(id,msgs) }
    if(current===id) await render(`<div class="note">${esc(errText(e&&e.code))}</div>`);
  }finally{ dlog("send_done",{chat:id}); clearTimeout(tm); busy=false; ctl=null; $("#send").disabled=false; $("#send").textContent="➤"; $("#send").setAttribute("aria-label","שליחה"); $("#send").title="" }
}

  const prompt=`את/ה ${byId[R.lead].name}, ${byId[R.lead].role} בצוות של {{OWNER}}. ${BIZ}
תפקידי הצוות:\n${roles}
היום ${today()}. זה לוח המשימות:\n${rows}

כתבי ל{{OWNER}} סקירת בקרה קצרה וברורה בעברית פשוטה, בלשון נקבה, בלי מונחים טכניים, במבנה הזה:
**מה תקוע או באיחור** (ומה הצעד הבא לשחרר כל אחד)
**מה דורש עוד עבודה או התייחסות שלך**
**מה עוד לא התחיל וכדאי לקדם השבוע**
**שיפור בחלוקת התפקידים** (מי עמוס מדי, משימה שכדאי להעביר, משימה שחסרה)
עד 15 שורות. אל תמציאי משימות שלא בלוח.`;
  try{ const {text}=await sample(prompt,{cache:false,...tierOpt(),onText:({text})=>{ out.innerHTML=`<div class="review"><div class="rh">${img(R.lead)}<b>הבקרה של ${esc(byId[R.lead].name)}</b></div>${fmt(text)}</div>` }});
    out.innerHTML=`<div class="review"><div class="rh">${img(R.lead)}<b>הבקרה של ${esc(byId[R.lead].name)}</b></div>${fmt(text)}</div>` }
  catch(e){ out.innerHTML=`<div class="review">${esc(errText(e&&e.code))}</div>` }
  finally{ btn.disabled=false }
});

/* ---------- strategy meeting: what to push now ---------- */
const AREAS=[["dev","פיתוח מוצר",R.product],["mkt","שיווק",R.marketing],["str","אסטרטגיה",R.strategy],["sales","מכירות",R.sales]];
let BRIEF=null;
async function loadBrief(){ if(!db) return; try{ const s=await db.doc(`data/users/${uid}/brief`).get(); if(s.exists){ BRIEF=JSON.parse(JSON.stringify(s.data())); if(!$("#brief").hidden) renderBrief() } }catch(e){} }
function renderBrief(){
  const out=$("#briefOut");
  if(!BRIEF){ out.innerHTML=`<div class="bsum">עוד לא הייתה ישיבת צוות. לחצי "ישיבת צוות עכשיו", והצוות יחזור אלייך עם ההמלצות. זה לוקח בערך דקה, כי הם חושבים לעומק.</div>`; return }
  const b=BRIEF;
  out.innerHTML=`<div class="bmeta">ישיבה מתאריך ${new Date(b.at).toLocaleDateString("he-IL")} ${new Date(b.at).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}</div>
    ${b.summary?`<div class="bsum">${fmt(b.summary)}</div>`:""}
    ${b.focus?`<div class="bfocus"><b>🎯 הדבר האחד לשבוע הזה:</b><br>${fmt(b.focus)}</div>`:""}
    ${AREAS.map(([k,label,def])=>{ const a=(b.areas||{})[k]; if(!a||!a.items||!a.items.length) return "";
      const who=byId[a.owner]?a.owner:def;
      return `<section class="barea" style="--oc:${oc(who)}"><h3>${img(who)} ${label} <small class="bmeta">· ${esc(byId[who].name)}</small></h3>
      ${a.items.map((it,j)=>`<div class="bitem" style="--oc:${oc(it.owner&&OWNERS[it.owner]?it.owner:who)}"><b>${esc(it.title||"")}</b>
        ${it.why?`<div class="why">${fmt(it.why)}</div>`:""}${it.step?`<div class="step">👣 צעד ראשון: ${fmt(it.step)}</div>`:""}
        <div class="act">${it.added?'<span class="ok">✓ בלוח המשימות</span>':`<button type="button" data-bi="${k}:${j}">להוסיף ללוח</button>`}</div></div>`).join("")}</section>`; }).join("")}`;
}
async function saveBrief(){ if(db){ try{ await db.doc(`data/users/${uid}/brief`).set(BRIEF) }catch(e){} } }
$("#briefOut").addEventListener("click",async e=>{ const btn=e.target.closest("button[data-bi]"); if(!btn) return;
  const [k,j]=btn.dataset.bi.split(":"); const a=BRIEF.areas[k]; const it=a.items[+j]; if(!it||it.added) return; btn.disabled=true;
  const who=it.owner&&OWNERS[it.owner]?it.owner:(byId[a.owner]?a.owner:AREAS.find(x=>x[0]===k)[2]);
  if(await addTask(who,it.title.slice(0,160),"todo","",AREAS.find(x=>x[0]===k)[2])){ it.added=true; await saveBrief(); renderBrief() } else btn.disabled=false });
function openBrief(){ $("#brief").hidden=false; document.body.style.overflow="hidden"; renderBrief() }
$("#briefBtn").addEventListener("click",openBrief);
$("#briefBack").addEventListener("click",()=>{ $("#brief").hidden=true; document.body.style.overflow="" });
$("#briefRun").addEventListener("click",async()=>{
  const out=$("#briefOut"), btn=$("#briefRun");
  if(!sample){ out.innerHTML=`<div class="bsum">ישיבת הצוות עובדת רק כשהדף פתוח באפליקציה של Claude.</div>`; return }
  btn.disabled=true; btn.textContent="הצוות בישיבה…";
  out.innerHTML=`<div class="bsum">הצוות התכנס ועובר על העסק, הלוח והיומן… זה לוקח בערך דקה.</div>`;
  let cal=""; try{ cal=await calendarContext() }catch(e){}
  const roster=TEAM.map(m=>`- ${m.id}: ${m.name}, ${m.role}`).join("\n");
  const prompt=`זו ישיבת צוות אסטרטגית של הצוות האישי של {{OWNER}}. ${BIZ}
${EXCEL}
${KB.all?"=== תיק העסק ===\n"+KB.all+"\n=== סוף ===":""}
${KB[R.marketing]?"=== ידע השיווק ===\n"+KB[R.marketing].slice(0,6000)+"\n=== סוף ===":""}
${MB.length?mbPick("סדרי עדיפויות שיווק עכשיו מה לקדם מה למדוד",12000,[]):""}
${tasksContext(null)}
היומן בימים הקרובים:\n${cal||"לא זמין"}
היום ${today()}.
חברי הצוות:\n${roster}

המטרה: להפוך את העסק של {{OWNER}} לעסק מצליח מאוד, בדרך שלה ובלי מניפולציות. תחשבו כמו היועצים הטובים ביותר. תנו לה את מה שהכי כדאי לקדם עכשיו, בארבעה תחומים:
- dev: פיתוח מוצר (הקורס, סולם מוצרים, מוצר הבא). אחראי/ת: ${R.product}.
- mkt: שיווק (תוכן, חשיפה, רשימת תפוצה, הוכחות). אחראי/ת: ${R.marketing}.
- str: אסטרטגיה (מיקוד, יעדים, מה לא לעשות, חלוקת זמן). אחראי/ת: ${R.strategy}.
- sales: מכירות (המרה, פולואפ, הצעה, התנגדויות). אחראי/ת: ${R.sales}.
בכל תחום 2-3 המלצות, מסודרות מהחשובה לפחות חשובה. כל המלצה: title (משפט קצר שאפשר לשים בלוח המשימות), why (למה זה יקדם את העסק, עם הנתונים שיש, עד 2 משפטים), step (צעד ראשון שאפשר לעשות השבוע), owner (id של חבר הצוות המתאים, או me אם רק היא יכולה).
בנוסף: summary (3-4 משפטים: איפה העסק עומד ומה ההזדמנות הגדולה ביותר) ו-focus (הדבר האחד שהכי כדאי לה לעשות השבוע, ולמה).
עברית פשוטה וחמה, לשון נקבה כלפי {{OWNER}}, בלי מונחים טכניים. אל תמציאו נתונים או מחירים. אל תחזרו על משימות שכבר בלוח, אלא אם צריך לשנות בהן משהו.
החזירו JSON בלבד: {"summary":"...","focus":"...","areas":{"dev":{"owner":"${R.product}","items":[{"title":"...","why":"...","step":"...","owner":"${R.product}"}]},"mkt":{...},"str":{...},"sales":{...}}}`;
  try{
    const res=await sample.json(prompt,{cache:false,...tierOpt()});
    if(!res||!res.areas) throw {code:"empty_completion"};
    for(const k in res.areas){ const a=res.areas[k]; if(!a||!Array.isArray(a.items)) delete res.areas[k]; else a.items=a.items.filter(i=>i&&i.title).slice(0,4) }
    BRIEF={summary:String(res.summary||""),focus:String(res.focus||""),areas:res.areas,at:Date.now()};
    await saveBrief(); renderBrief();
  }catch(e){ out.innerHTML=`<div class="bsum">${esc(errText(e&&e.code))}</div>` }
  finally{ btn.disabled=false; btn.textContent="✨ ישיבת צוות עכשיו" }
});

function parseJSONLoose(t){ t=String(t||""); const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a<0||b<=a) return null;
  try{ return JSON.parse(t.slice(a,b+1)) }catch(e){ return null } }

/* ---------- boot ---------- */
renderGrid(); fillForm();
if(location.hash==="#board") openBoard();
(async()=>{
  if(!window.claude?.use){ subscribeTasks(); return }
  dlog("boot",{});
  claude.use("sample").then(async s=>{ sample=s; dlog("sample_ready",{ok:!!s}); try{ const l=await s.limits(); const t=l&&l.modelTiers; TIER=(!t||t.includes("complex"))?"complex":null }catch(e){} });
  claude.use("mcp").then(m=>{ mcp=m });
  claude.use("dictation").then(d=>{ dict=d; setupVoice() });
  claude.use("tts").then(t=>{ tts=t; if(current) render() });
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(d&&u){ const i=await u.id(); if(i){ db=d; uid=i; for(const k in cache) delete cache[k]; if(current) render(); loadKB(); loadBrief(); loadMB();
      try{ const prev=await db.doc(`data/users/${uid}/debug`).get(); if(prev.exists){ const old=JSON.parse(JSON.stringify(prev.data().log||[])); DBG.unshift(...old.slice(-80)) } }catch(e){}
      dlog("db_ready") } }
    if(d&&u&&typeof u.can==="function"){ const w=await u.can("data.write"); if(w===false){ canWrite=false; document.body.classList.add("ro") } }
  }catch(e){}
  subscribeTasks();
})();
</script>
