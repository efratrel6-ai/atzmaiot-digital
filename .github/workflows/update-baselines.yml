name: Update visual baselines

# מעדכן את תמונות הבסיס של הבדיקה החזותית (על לינוקס, כמו ב-CI).
# להפעלה: לדחוף ענף ששמו מתחיל ב-baselines/ (או להריץ ידנית מלשונית Actions על ענף כזה).
# רק כשאפרת ביקשה שינוי עיצובי במכוון! ראי README.

on:
  workflow_dispatch:
  push:
    branches: ["baselines/**"]

permissions:
  contents: write

jobs:
  update:
    if: startsWith(github.ref, 'refs/heads/baselines/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test visual --update-snapshots
      - name: Commit new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/baselines
          git diff --cached --quiet && echo "אין שינוי בתמונות" && exit 0
          git commit -m "Update visual baselines"
          git push
