name: Weekly live check

# פעם בשבוע בודק את האתר החי https://efrat-cohen.co.il ופותח Issue בעברית אם משהו נשבר.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_URL: https://efrat-cohen.co.il
    steps:
      - name: Domain reachable?
        id: dom
        run: |
          code=$(curl -s -o /dev/null -m 20 -L -w "%{http_code}" https://efrat-cohen.co.il || true)
          if [ "$code" != "200" ]; then
            echo "הדומיין עוד לא מחובר (סטטוס $code), מדלגים על הבדיקה ולא פותחים Issue"
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dom.outputs.ok == 'yes'
        uses: actions/checkout@v4
      - if: steps.dom.outputs.ok == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.dom.outputs.ok == 'yes'
        run: npm ci
      - if: steps.dom.outputs.ok == 'yes'
        run: npx playwright install chromium --with-deps
      - id: run
        if: steps.dom.outputs.ok == 'yes'
        run: npx playwright test live smoke quality
        continue-on-error: true
      - name: Open Hebrew issue on failure
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "live-check" --color B60205 --description "בדיקה שבועית של האתר החי" 2>/dev/null || true
          if [ -n "$(gh issue list --label live-check --state open --json number --jq '.[0].number')" ]; then
            echo "כבר יש Issue פתוח, לא פותחים עוד אחד"; exit 0
          fi
          gh issue create --label live-check \
            --title "הבדיקה השבועית של האתר החי נכשלה" \
            --body "הבדיקה האוטומטית של https://efrat-cohen.co.il נכשלה. יש לבדוק: האתר נפתח? כפתור התשלום (Schooler) עובד? ראו את הפירוט בריצה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - if: steps.run.outcome == 'failure'
        run: exit 1
